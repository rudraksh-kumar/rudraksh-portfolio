<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Text / Letter Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Glow Filter for Modern Tech Vibe -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container with Border Glow -->
  <rect x="6" y="6" width="500" height="500" rx="140" fill="url(#bgGrad)" stroke="#8b5cf6" stroke-width="12" stroke-opacity="0.4"/>
  
  <!-- "RK" Monogram Paths -->
  <g filter="url(#glow)">
    <!-- Letter R -->
    <path d="M 170 140 L 170 372" stroke="url(#textGrad)" stroke-width="38" stroke-linecap="round"/>
    <path d="M 170 140 H 235 C 285 140 285 246 235 246 H 170" stroke="url(#textGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 205 246 L 265 372" stroke="url(#textGrad)" stroke-width="38" stroke-linecap="round"/>

    <!-- Letter K -->
    <path d="M 342 140 L 342 372" stroke="url(#textGrad)" stroke-width="38" stroke-linecap="round"/>
    <path d="M 425 140 L 342 256 L 425 372" stroke="url(#textGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>